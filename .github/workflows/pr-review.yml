name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # On a public repo anyone can comment and any reader can open a same-repo PR, so both paths need a trusted author; Dependabot PRs are keyed on the PR author, not the actor.
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      && (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && github.event.issue.user.login != 'dependabot[bot]'
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Job-level so a run skipped by `if:` never joins the group; no cancel, so a paid review is never killed mid-run.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # A comment payload has no head repo, so a fork PR is only detectable via the API; fails closed.
      - name: Same-repo check
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "issue_comment" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""') || head_repo=""
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not reviewing PR #$PR_NUMBER: head repo '$head_repo' is not $GITHUB_REPOSITORY"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          # Nothing later pushes or fetches, so the job token need not sit in .git/config while npm ci runs package scripts.
          persist-credentials: false
      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.guard.outputs.run == 'true'
        run: npm ci && npm run bundle
      - if: steps.guard.outputs.run == 'true'
        run: |
          node dist/pr-review-agent.cjs \
            --vcs github \
            --workspace "${{ github.repository_owner }}" \
            --repo-slug "${{ github.event.repository.name }}" \
            --pr-id "${{ github.event.pull_request.number || github.event.issue.number }}"
        env:
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_MODEL: anthropic/claude-haiku-5.5
          JUDGING_MODEL: anthropic/claude-haiku-5.5
          REPLY_MODEL: anthropic/claude-haiku-5.5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_IDENTITY: github-actions[bot]
          # GitHub flow targets main directly; the default main,master would skip every PR
          SKIP_TARGET_BRANCHES: ""
